 return "こんにちは。私はAsukaです。13歳です。今日は姉（妹）のHarukaについて話します。Harukaは15歳です。料理が得意です。先週、私のためにクッキーを作ってくれました。それはおいしかったです。私たちは仲のよい姉妹です。週末にはよく買い物に行きます。次の日曜日には映画を見に行く予定です。とても楽しみです。";
}
$("next").onclick=()=>{idx++;if(idx<sets._run.length)render();else finish()}
function finish(){
 $("quiz").classList.add("hide");
 $("result").classList.remove("hide");
 const nextSection=section<8?section+1:null;
 $("result").innerHTML=`<h2>大問${section} 結果</h2>
   <div class="score">${score} / ${sets._run.length}問 正解</div>
   ${wrong.length?`<button class="btn" id="retryWrong">間違えた問題だけやる</button>`:`<p class="ok" style="text-align:center;font-weight:800">全問正解！</p>`}
   <button class="btn sub" id="retryAll">大問${section}を最初から</button>
   ${nextSection?`<button class="btn sub" id="goNext">大問${nextSection}へ進む</button>`:""}
   <button class="btn sub" id="backMenu">大問を選ぶ</button>`;
 if(wrong.length)$("retryWrong").onclick=()=>start(section,[...wrong]);
 $("retryAll").onclick=()=>start(section);
 if(nextSection)$("goNext").onclick=()=>start(nextSection);
 $("backMenu").onclick=()=>location.reload();
}
</script></body></html>
